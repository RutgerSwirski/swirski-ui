name: Publish Swirski UI

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  publish:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/swirski-ui-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: publish-ui-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Verify release version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if [[ "$RELEASE_BRANCH" != "release/swirski-ui-$version" ]]; then
            echo "Release branch does not match package version $version"
            exit 1
          fi
          echo "RELEASE_TAG=swirski-ui@$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui
      - run: pnpm check:ui-package
      - run: npm install --global npm@11
      - name: Publish to npm
        working-directory: packages/ui
        run: npm publish --access public
      - name: Tag the published commit
        run: |
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
